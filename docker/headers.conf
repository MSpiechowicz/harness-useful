# Static security headers. Included in every server/location block, because a location that
# declares any add_header drops the ones inherited from the server level.
# The Content-Security-Policy header lives in csp.conf (generated by scripts/gen-csp.ts).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=63072000" always;
