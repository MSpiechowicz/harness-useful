# Server block for nginxinc/nginx-unprivileged, installed as /etc/nginx/conf.d/default.conf.
# Every location includes the header snippets: add_header in a location replaces inherited ones.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;
  autoindex off;

  # Headers for responses nginx produces outside any location (e.g. malformed requests).
  include /etc/nginx/snippets/headers.conf;
  include /etc/nginx/snippets/csp.conf;

  # Precompressed .gz files from adapter-static are preferred; everything else is compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml
    text/plain
    text/xml
    text/markdown;

  # nginx's default mime.types has no markdown entry; unmatched extensions fall back to default_type.
  charset utf-8;
  charset_types text/html text/xml text/plain text/markdown application/xml;

  error_page 404 /404.html;

  location = /healthz {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # The error page is only reachable through error_page; a direct request is a 404 that renders it.
  # Without this, /404 would be served from 404.html with status 200 by the pages location.
  location = /404 {
    return 404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Hidden files and directories (.git, .env, ...) are never served. A ^~ prefix location skips this
  # regex location, so each of those repeats the rule in a nested location.
  location ~ /\. {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    return 404;
  }

  location ^~ /_app/immutable/ {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    location ~ /\. {
      include /etc/nginx/snippets/headers.conf;
      include /etc/nginx/snippets/csp.conf;
      return 404;
    }

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ^~ /media/ {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    location ~ /\. {
      include /etc/nginx/snippets/headers.conf;
      include /etc/nginx/snippets/csp.conf;
      return 404;
    }

    add_header Cache-Control "public, max-age=86400" always;
    max_ranges 1;
    try_files $uri =404;
  }

  location ^~ /og/ {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    location ~ /\. {
      include /etc/nginx/snippets/headers.conf;
      include /etc/nginx/snippets/csp.conf;
      return 404;
    }

    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location ^~ /icons/ {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    location ~ /\. {
      include /etc/nginx/snippets/headers.conf;
      include /etc/nginx/snippets/csp.conf;
      return 404;
    }

    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /favicon.svg {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Markdown twins of the pages and the crawler files.
  location ~ ^/(sitemap\.xml|robots\.txt|llms[^/]*\.txt|[^/]+\.md)$ {
    default_type text/markdown;
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = / {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # /index would otherwise be served from index.html with 200 by the pages location; it redirects to / (query kept).
  location = /index {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    return 301 /$is_args$args;
  }

  # Pages: /desktop is served from desktop.html; /desktop/ and /desktop.html redirect to /desktop
  # (relative Location, query string kept). The .html match uses $request_uri, the client's original
  # URI, because $uri changes during the try_files lookup below.
  # Both redirects only accept slugs (lowercase letters, digits, hyphens) so the Location can never
  # start with // or /\, which browsers resolve as another host (open redirect). Anything else is a 404.
  location / {
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "no-cache" always;

    if ($request_uri ~ ^/index\.html(\?.*)?$) {
      return 301 /$1;
    }

    if ($request_uri ~ ^/([a-z0-9-]+(?:/[a-z0-9-]+)*)\.html(\?.*)?$) {
      return 301 /$1$2;
    }

    rewrite ^/([a-z0-9-]+(?:/[a-z0-9-]+)*)/$ /$1 permanent;
    try_files $uri $uri.html $uri/index.html =404;
  }
}
